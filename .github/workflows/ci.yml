name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Windows の実行ファイルを作り、Actions の成果物(Artifacts)から落とせるようにする
  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      # exe は同じフォルダの ps1 を呼んで ISO を作るので、同じフォルダに並べて入れる
      - shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/folder2iso.exe, tools/folder2DVD_ISO.ps1, README.md dist/
          Copy-Item tools/README.md dist/folder2DVD_ISO_README.md
      - uses: actions/upload-artifact@v4
        with:
          name: folder2iso-windows-x64
          path: dist/
